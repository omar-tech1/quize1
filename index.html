<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>اختبار صح وخطأ - شبكات الحاسب وتطبيقاتها</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-base:       #080f1e;
    --bg-card:       #0f1a2e;
    --bg-surface:    #162035;
    --bg-hover:      #1c2a44;
    --accent:        #22d3a0;
    --accent-dim:    #16a87e;
    --accent-glow:   rgba(34,211,160,0.15);
    --red:           #f87171;
    --red-dim:       rgba(248,113,113,0.12);
    --green-dim:     rgba(34,211,160,0.12);
    --text-primary:  #e2e8f0;
    --text-secondary:#94a3b8;
    --text-muted:    #475569;
    --border:        rgba(255,255,255,0.07);
    --border-accent: rgba(34,211,160,0.3);
    --radius:        14px;
    --radius-sm:     8px;
    --radius-pill:   999px;
    --shadow:        0 4px 24px rgba(0,0,0,0.5);
  }

  html, body {
    height: 100%;
    font-family: 'Cairo', sans-serif;
    background: var(--bg-base);
    color: var(--text-primary);
    direction: rtl;
  }

  body {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(34,211,160,0.06) 0%, transparent 60%),
      radial-gradient(ellipse 60% 40% at 80% 110%, rgba(99,102,241,0.05) 0%, transparent 50%);
  }

  .site-header {
    width: 100%;
    padding: 18px 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    backdrop-filter: blur(12px);
    background: rgba(8,15,30,0.7);
    position: sticky;
    top: 0;
    z-index: 100;
    flex-wrap: wrap;
    gap: 10px;
  }

  .header-brand { display: flex; align-items: center; gap: 10px; }
  .brand-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .brand-name { font-size: 15px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.3px; }

  .header-stats { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  .stat-chip {
    font-size: 12px; font-weight: 600; padding: 5px 14px;
    border-radius: var(--radius-pill); border: 1px solid var(--border);
    background: var(--bg-surface); color: var(--text-secondary); transition: all 0.2s;
  }
  .stat-chip.correct { color: var(--accent); border-color: var(--border-accent); background: var(--accent-glow); }
  .stat-chip.wrong   { color: var(--red); border-color: rgba(248,113,113,0.3); background: var(--red-dim); }

  .progress-track { width: 100%; height: 3px; background: var(--bg-surface); position: sticky; top: 57px; z-index: 99; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transition: width 0.5s cubic-bezier(0.4,0,0.2,1); box-shadow: 0 0 10px var(--accent); }

  .page-body { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 40px 20px 60px; }
  .quiz-container { width: 100%; max-width: 780px; }

  .q-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 36px 40px;
    box-shadow: var(--shadow); animation: slideIn 0.35s cubic-bezier(0.4,0,0.2,1);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .q-meta { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; flex-wrap: wrap; gap: 8px; }

  .section-badge {
    font-size: 11px; font-weight: 700; letter-spacing: 0.4px;
    padding: 4px 12px; border-radius: var(--radius-pill);
    border: 1px solid; white-space: nowrap;
  }
  .badge-c1 { background: rgba(34,211,160,0.12); border-color: rgba(34,211,160,0.35); color: #22d3a0; }
  .badge-c2 { background: rgba(139,127,245,0.12); border-color: rgba(139,127,245,0.35); color: #8b7ff5; }
  .badge-c3 { background: rgba(251,146,60,0.12);  border-color: rgba(251,146,60,0.35);  color: #fb923c; }
  .badge-c4 { background: rgba(56,189,248,0.12);  border-color: rgba(56,189,248,0.35);  color: #38bdf8; }

  .q-counter { font-size: 12px; color: var(--text-muted); font-weight: 500; }
  .q-text { font-size: 19px; font-weight: 600; color: var(--text-primary); line-height: 1.7; margin-bottom: 28px; }

  .tf-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }

  .tf-btn {
    padding: 20px 14px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--bg-surface);
    cursor: pointer; font-family: 'Cairo', sans-serif;
    font-size: 17px; font-weight: 700; color: var(--text-primary);
    text-align: center; transition: all 0.2s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .tf-btn:hover:not(:disabled) { background: var(--bg-hover); border-color: rgba(255,255,255,0.15); transform: translateY(-2px); }
  .tf-btn.state-correct { background: var(--green-dim); border-color: var(--accent); color: var(--accent); animation: pop 0.3s ease; }
  .tf-btn.state-wrong   { background: var(--red-dim);   border-color: var(--red);    color: var(--red);    animation: shake 0.35s ease; }
  .tf-btn:disabled { cursor: default; }

  @keyframes pop   { 0%{transform:scale(0.97)} 60%{transform:scale(1.02)} 100%{transform:scale(1)} }
  @keyframes shake { 0%{transform:translateX(0)} 20%{transform:translateX(-6px)} 40%{transform:translateX(6px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)} 100%{transform:translateX(0)} }

  .feedback {
    display: none; padding: 14px 18px; border-radius: var(--radius-sm);
    font-size: 14px; font-weight: 500; line-height: 1.7; margin-bottom: 24px; border: 1px solid;
  }
  .feedback.state-correct { background: var(--green-dim); border-color: var(--border-accent); color: #6ee7b7; }
  .feedback.state-wrong   { background: var(--red-dim);   border-color: rgba(248,113,113,0.3); color: #fca5a5; }

  .nav-row { display: none; justify-content: flex-end; }
  .nav-btn {
    padding: 12px 28px; border-radius: var(--radius-sm); border: none;
    background: var(--accent); color: #000; font-family: 'Cairo', sans-serif;
    font-size: 15px; font-weight: 700; cursor: pointer;
    transition: all 0.2s ease; box-shadow: 0 0 20px rgba(34,211,160,0.2);
  }
  .nav-btn:hover { background: #34ebb4; transform: translateY(-1px); box-shadow: 0 0 28px rgba(34,211,160,0.35); }

  .result-card {
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 56px 40px 48px;
    box-shadow: var(--shadow); text-align: center;
    animation: slideIn 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .result-circle {
    width: 130px; height: 130px; border-radius: 50%;
    border: 3px solid var(--border); background: var(--bg-surface);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; margin: 0 auto 28px;
  }
  .result-pct { font-size: 34px; font-weight: 800; color: var(--accent); line-height: 1; }
  .result-pct-label { font-size: 11px; color: var(--text-muted); font-weight: 600; }
  .result-grade { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .result-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 36px; }

  .result-stats { display: flex; justify-content: center; gap: 0; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; margin-bottom: 36px; }
  .rs-item { flex: 1; padding: 20px 16px; border-left: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
  .rs-item:last-child { border-left: none; }
  .rs-value { font-size: 28px; font-weight: 800; line-height: 1; }
  .rs-label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
  .rs-correct .rs-value { color: var(--accent); }
  .rs-wrong   .rs-value { color: var(--red); }

  .cat-block { margin: 32px auto 0; text-align: center; }
  .cat-block img { width: 180px; height: 180px; border-radius: 50%; object-fit: cover; border: 3px solid var(--accent); box-shadow: 0 0 28px var(--accent-glow); display: block; margin: 0 auto 14px; }
  .cat-title { font-size: 22px; font-weight: 800; color: var(--accent); margin-bottom: 6px; }
  .cat-sub   { font-size: 15px; color: var(--text-secondary); }

  .restart-btn {
    margin-top: 28px; padding: 14px 40px; border-radius: var(--radius-sm);
    border: none; background: var(--accent); color: #000;
    font-family: 'Cairo', sans-serif; font-size: 16px; font-weight: 700;
    cursor: pointer; transition: all 0.2s ease; box-shadow: 0 0 24px rgba(34,211,160,0.25);
  }
  .restart-btn:hover { background: #34ebb4; transform: translateY(-2px); box-shadow: 0 0 36px rgba(34,211,160,0.4); }

  .site-footer { text-align: center; padding: 20px; font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border); }

  @media (max-width: 640px) {
    .site-header { padding: 14px 20px; }
    .brand-name { font-size: 13px; }
    .q-card { padding: 24px 20px; }
    .q-text { font-size: 16px; }
    .result-card { padding: 36px 20px 32px; }
    .result-stats { flex-direction: column; }
    .rs-item { border-left: none; border-bottom: 1px solid var(--border); }
    .rs-item:last-child { border-bottom: none; }
  }
</style>
</head>
<body>

<header class="site-header">
  <div class="header-brand">
    <div class="brand-dot"></div>
    <span class="brand-name">اختبار صح وخطأ — الملفات الأربعة</span>
  </div>
  <div class="header-stats">
    <div class="stat-chip" id="chip-q">السؤال 1 من 50</div>
    <div class="stat-chip correct" id="chip-sc">✓ 0</div>
    <div class="stat-chip wrong"   id="chip-wr">✗ 0</div>
  </div>
</header>

<div class="progress-track">
  <div class="progress-fill" id="pf" style="width:0%"></div>
</div>

<div class="page-body">
  <div class="quiz-container">
    <div id="area"></div>
  </div>
</div>

<footer class="site-footer">اختبار شامل · شبكات الحاسب وتطبيقاتها في التعليم — الملفات الأربعة</footer>

  {s:"تطبيقات شبكات الحاسب",c:1,q:"شبكات الحاسب الآلي هي مجموعة من الأجهزة المترابطة بهدف تبادل البيانات والمعلومات والموارد.",a:true,e:"تعريف صحيح تمامًا؛ شبكات الحاسب هي مجموعة أجهزة مترابطة سلكيًا أو لاسلكيًا لتبادل البيانات والموارد."},
  {s:"تطبيقات شبكات الحاسب",c:1,q:"الحوسبة السحابية تُقيّد الوصول إلى الملفات بحيث لا يمكن الوصول إليها إلا من مكان واحد محدد.",a:false,e:"الحوسبة السحابية تسمح بتخزين الملفات والوصول إليها من أي مكان وزمان، وهذا هو جوهر ميزتها."},
  {s:"تطبيقات شبكات الحاسب",c:1,q:"من مزايا شبكات الحاسب: تعزيز التعاون بين الطلاب وتقليل التكاليف وتحسين جودة التعليم.",a:true,e:"هذه المزايا مذكورة صراحةً في المادة العلمية للملف الأول."},
  {s:"تطبيقات شبكات الحاسب",c:1,q:"الاختبارات الإلكترونية ليست من تطبيقات شبكات الحاسب في التعليم.",a:false,e:"الاختبارات الإلكترونية هي أحد تطبيقات شبكات الحاسب في التعليم إلى جانب الفصول الافتراضية والمكتبات الرقمية."},
  {s:"إنترنت الأشياء",c:1,q:"إنترنت الأشياء (IoT) هو نظام يربط الأجهزة المادية بالإنترنت لجمع البيانات وتبادلها واتخاذ قرارات ذكية تلقائيًا.",a:true,e:"هذا هو التعريف الدقيق لإنترنت الأشياء كما ورد في الملف."},
  {s:"إنترنت الأشياء",c:1,q:"أنظمة الحضور الذكية والمكتبات الذكية من تطبيقات إنترنت الأشياء في التعليم.",a:true,e:"تطبيقات IoT في التعليم تشمل: الفصول الذكية، أنظمة الحضور الذكية، المكتبات الذكية، وأنظمة الأمن والسلامة."},
  {s:"إنترنت الأشياء",c:1,q:"إنترنت الأشياء لا يساعد على جمع البيانات المتعلقة بأداء المتعلمين وتحليلها.",a:false,e:"من أهم فوائد IoT في التعليم أنه يساعد على جمع بيانات أداء المتعلمين وتحليلها لتحسين العملية التعليمية."},
  {s:"إنترنت الأشياء",c:1,q:"من تحديات إنترنت الأشياء: ارتفاع تكاليف التنفيذ والحاجة إلى خبرات تقنية متقدمة.",a:true,e:"التحديات الرئيسية لـ IoT هي: حماية البيانات والخصوصية، ارتفاع تكاليف التنفيذ، والحاجة إلى خبرات تقنية متقدمة."},
  {s:"التعلم عن بعد",c:1,q:"التعلم عن بعد يشترط الحضور الفعلي داخل المؤسسة التعليمية.",a:false,e:"التعلم عن بعد هو نظام يعتمد على الإنترنت والتقنيات الرقمية لتقديم المحتوى التعليمي دون الحاجة للحضور الفعلي."},
  {s:"التعلم عن بعد",c:1,q:"من مزايا التعلم عن بعد: استمرارية التعليم في الأزمات وتوفير الوقت والجهد وخفض التكاليف.",a:true,e:"هذه من أبرز مزايا التعلم عن بعد المذكورة في الملف الأول."},
  {s:"التعلم عن بعد",c:1,q:"ضعف الإنترنت وقلة التفاعل الاجتماعي من أبرز تحديات التعلم عن بعد.",a:true,e:"من أبرز تحديات التعلم عن بعد: ضعف الإنترنت، وقلة التفاعل الاجتماعي، وصعوبة تقييم بعض المهارات العملية."},
  {s:"الأنظمة الهجينة",c:1,q:"الأنظمة الهجينة تجمع بين التعليم التقليدي داخل الفصول والتعليم الإلكتروني عبر الإنترنت.",a:true,e:"تعريف الأنظمة الهجينة: نماذج تعليمية تجمع بين التعليم التقليدي والإلكتروني لتحقيق التوازن المثالي."},
  {s:"الأنظمة الهجينة",c:1,q:"من مكونات النظام الهجين: التعلم الحضوري والتعلم الإلكتروني المتزامن وغير المتزامن والتقييم الرقمي.",a:true,e:"هذه هي مكونات النظام الهجين الأربعة المذكورة صراحةً في الملف."},
  {s:"الأنظمة الهجينة",c:1,q:"تحقيق العدالة الرقمية ليست من تحديات الأنظمة الهجينة.",a:false,e:"تحقيق العدالة الرقمية من أبرز تحديات الأنظمة الهجينة إلى جانب توفير البنية التحتية وتدريب المعلمين."},
  {s:"البنية التحتية للشبكات",c:2,q:"شبكة MAN صممت لربط مدينة أو مدينتين متجاورتين وتستخدم الألياف البصرية أو الوسائل الرقمية.",a:true,e:"شبكة MAN (Metropolitan Area Network) إقليمية تربط مدينة أو مدينتين وتستخدم الألياف البصرية أو الوسائل الرقمية لسرعات فائقة."},
  {s:"البنية التحتية للشبكات",c:2,q:"شبكة WAN كلما زادت المسافة بين عناصرها زادت سرعة نقل البيانات.",a:false,e:"العكس صحيح: كلما زادت المسافة بين عناصر WAN قلّت السرعة التي يمكن بها نقل البيانات."},
  {s:"البنية التحتية للشبكات",c:2,q:"الإنترنت صُممت أساسًا لأغراض عسكرية أيام الحرب الباردة وظهرت في ذلك الوقت باسم Arpanet.",a:true,e:"الإنترنت نشأت للأغراض العسكرية باسم Arpanet ثم تطورت حتى أصبحت الشبكة العالمية التي نعرفها اليوم."},
  {s:"البنية التحتية للشبكات",c:2,q:"جهاز Hub يميز بين الجهاز المرسل والمستقبل ويرسل البيانات للجهاز المحدد فقط.",a:false,e:"Hub لا يميز بين الأجهزة ويرسل البيانات لجميع الأجهزة المتصلة، مما يسبب تصادمًا وازدحامًا. وقد استُبدل غالبًا بالـ Switch."},
  {s:"البنية التحتية للشبكات",c:2,q:"الراوتر (Router) جهاز يربط شبكتين مختلفتين ويوجه البيانات بينهما.",a:true,e:"وظيفة الراوتر الأساسية هي ربط شبكتين مختلفتين وتوجيه البيانات بينهما، وقد يبث إشارة لاسلكية أيضًا."},
  {s:"البنية التحتية للشبكات",c:2,q:"Access Point يربط بين شبكتين مختلفتين تمامًا مثل الراوتر.",a:false,e:"الفرق جوهري: Router يربط بين شبكتين، أما Access Point فيوسّع شبكةً موجودة لاسلكيًا فقط ولا يربط شبكتين مستقلتين."},
  {s:"البنية التحتية للشبكات",c:2,q:"لكل كرت شبكة (NIC) عنوان فريد يُسمى MAC Address.",a:true,e:"كل كرت شبكة له عنوان MAC فريد تحدده لجنة IEEE، ويُستخدم للتعرف على الجهاز داخل الشبكة."},
  {s:"البنية التحتية للشبكات",c:2,q:"بروتوكول IPv6 يتكون من 32 بت فقط مثل IPv4.",a:false,e:"IPv4 يتكون من 32 بت، أما IPv6 فيتكون من 128 بت وصُمِّم لحل مشكلة نفاذ عناوين IPv4."},
  {s:"البنية التحتية للشبكات",c:2,q:"بروتوكول TCP مسؤول عن ضمان سلامة البيانات وترتيبها، بينما IP مسؤول عن توجيه البيانات إلى العنوان الصحيح.",a:true,e:"يعمل البروتوكولان معًا: TCP يضمن سلامة البيانات وترتيبها، وIP يوجّهها عبر الشبكة."},
  {s:"البنية التحتية للشبكات",c:2,q:"بروتوكول DNS يُستخدم لحماية البيانات أثناء النقل بالتشفير.",a:false,e:"DNS يحوّل أسماء المواقع مثل google.com إلى عناوين IP يتعرف عليها الجهاز. أما التشفير فهو وظيفة HTTPS وليس DNS."},
  {s:"البنية التحتية للشبكات",c:2,q:"الشبكات السلكية أعلى تكلفةً في التأسيس لكنها أكثر أمانًا وثباتًا من اللاسلكية.",a:true,e:"مقارنة بين الشبكات: السلكية أعلى تكلفةً وأكثر أمانًا وسرعتها ثابتة، أما اللاسلكية فأقل تكلفةً وأكثر مرونةً لكنها تحتاج تشفيرًا قويًا."},
  {s:"البنية التحتية للشبكات",c:2,q:"بروتوكول TCP يعتمد على المصافحة الثلاثية (Three-way Handshake) لإنشاء الاتصال.",a:true,e:"يُنشئ TCP الاتصال عبر آلية المصافحة الثلاثية: SYN ثم SYN-ACK ثم ACK، قبل البدء في إرسال البيانات."},
  {s:"البنية التحتية للشبكات",c:2,q:"بروتوكول HTTPS هو النسخة غير الآمنة من HTTP ولا يستخدم التشفير.",a:false,e:"HTTPS هو النسخة الآمنة من HTTP ويستخدم التشفير لحماية البيانات أثناء النقل مثل كلمات المرور وبيانات الدفع."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"الشبكات في المؤسسات التعليمية تتيح مشاركة الملفات والطابعات وقواعد البيانات والوصول إلى منصات التعليم الإلكتروني.",a:true,e:"هذه من أبرز فوائد الشبكات في المؤسسات التعليمية: مشاركة الموارد والوصول إلى مصادر التعلم الإلكتروني والتواصل الفعال."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"الضغط الكبير على الشبكة أثناء الامتحانات الإلكترونية ليس من تحديات الشبكات التعليمية.",a:false,e:"الضغط الكبير على الشبكة أثناء الامتحانات الإلكترونية من أبرز التحديات التي تواجه الشبكات في المؤسسات التعليمية."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"شبكات Wi-Fi 7 بدأت الجامعات بتبنيها لدعم المختبرات الافتراضية التي تتطلب سرعات عالية.",a:true,e:"أحدث التوجهات تشمل تبني معيار Wi-Fi 7 لدعم المختبرات الافتراضية (AR/VR) التي تتطلب سرعات هائلة وتأخيرًا يقترب من الصفر."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"المعمل الذكي هو غرفة دراسية عادية بدون أجهزة أو تقنيات حديثة.",a:false,e:"المعمل الذكي بيئة تعليمية مزودة بتقنيات حديثة تتيح للطلاب إجراء التجارب والمحاكاة باستخدام أجهزة رقمية متقدمة."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"أجهزة الاستشعار وخوارزميات التعلم الآلي وأنظمة الاتصال من المكونات التقنية الأساسية للمعمل الذكي.",a:true,e:"المكونات التقنية الأساسية للمعمل الذكي هي: أجهزة الاستشعار لجمع البيانات، وخوارزميات التعلم الآلي، وأنظمة الاتصال والشبكات."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"تحديد الهدف التعليمي هو أول خطوة في تصميم المعمل الذكي.",a:true,e:"خطوات تصميم المعمل الذكي تبدأ بتحديد الهدف التعليمي، ثم دراسة عدد الطلاب والمساحة، ثم اختيار الأجهزة والبرمجيات."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"المعمل الذكي يُقيّد التعلم بأن يكون داخل المعمل فقط ولا يمكن العمل عن بعد.",a:false,e:"من مزايا المعمل الذكي إمكانية العمل عن بعد والمرونة في تنفيذ التجارب من أي مكان، عكس المعمل التقليدي."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"أمن المعلومات يعتمد على ثلاثة عناصر: السرية والسلامة والتوافرية (CIA Triad).",a:true,e:"نموذج CIA هو أساس أمن المعلومات: السرية (Confidentiality)، والسلامة (Integrity)، والتوافرية (Availability)."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"هجمات التصيد الإلكتروني (Phishing) تستخدم رسائل بريد حقيقية وموثوقة لسرقة البيانات.",a:false,e:"Phishing يعتمد على رسائل بريد مزيفة تبدو شرعية بهدف سرقة بيانات الدخول، وليست رسائل حقيقية أو موثوقة."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"جدار الحماية (Firewall) يمنع الدخول غير المصرح به إلى الشبكة.",a:true,e:"جدار الحماية من أدوات الحماية الأساسية ووظيفته منع الدخول غير المصرح به والتحكم في حركة البيانات."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"قطاع التعليم من أقل القطاعات تعرضًا لهجمات برامج الفدية.",a:false,e:"وفقًا لتقارير IBM Security، قطاع التعليم من أكثر القطاعات تعرضًا لهجمات برامج الفدية عالميًا بسبب احتوائه على بيانات حساسة."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"المصادقة الثنائية تُضيف طبقة أمان إضافية لحماية الحسابات بحيث لا تكفي كلمة المرور وحدها للدخول.",a:true,e:"المصادقة الثنائية تعزز حماية الحسابات بطبقة أمان إضافية، وهي من أهم أدوات حماية المعلومات."},
  {s:"الشبكات في المؤسسات التعليمية",c:3,q:"أمن المعلومات مجرد برامج حماية وليس ثقافة أو وعيًا بشريًا.",a:false,e:"أمن المعلومات ثقافة قبل أن يكون مجرد برامج حماية، والوعي البشري يظل خط الدفاع الأول."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"الشبكة عبارة عن مجموعة من الأجهزة الإلكترونية المتصلة ببعضها بغرض مشاركة المعلومات والخدمات.",a:true,e:"هذا هو التعريف الدقيق للشبكة كما ورد في الجزء النظري."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"في المعالجة الموزعة يتم تركيز كافة عمليات المعالجة على جهاز مركزي واحد.",a:false,e:"في المعالجة الموزعة تقوم عدة أجهزة بتوزيع المهام فيما بينها، مما يقلل الاعتماد على المعالجة المركزية."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"الوظيفة الأساسية للسيرفر هي مشاركة المصادر والتحكم في حسابات المستخدمين وصلاحياتهم.",a:true,e:"السيرفر يشارك البيانات والبرامج والطابعات ويتحكم في حسابات المستخدمين ويمنحهم أو يمنعهم من الوصول لموارد الشبكة."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"في شبكة الند للند (Peer-to-Peer) يوجد سيرفر مركزي يدير جميع الأجهزة.",a:false,e:"شبكة الند للند لا تحتوي على سيرفر مركزي، وكل جهاز يؤدي وظيفتَي الزبون والمزود في آنٍ واحد."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"شبكة الزبون/المزود أكثر تكلفةً من شبكة الند للند لكنها أوفر حمايةً وأقدر على دعم آلاف المستخدمين.",a:true,e:"شبكات الزبون/المزود أعلى تكلفةً لكنها توفر حمايةً عاليةً ودعم آلاف المستخدمين ونسخًا احتياطيًا منتظمًا."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"بطاقة الشبكة (NIC) هي الواجهة التي تصل بين جهاز الكمبيوتر وسلك الشبكة، وبدونها لا يستطيع الجهاز الاتصال بالشبكة.",a:true,e:"بطاقة الشبكة هي الواجهة الفيزيائية للاتصال، وبدونها لا يمكن للكمبيوتر الاتصال بالشبكة سلكيًا أو لاسلكيًا."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"كابل Coaxial الرفيع (Thin Coaxial) يمكن أن يحمل الإشارة إلى 500 متر قبل أن تبدأ بالاضمحلال.",a:false,e:"كابل Thin Coaxial يحمل الإشارة حتى 185 متر، أما Thick Coaxial فيحملها حتى 500 متر."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"كابل الألياف الضوئية (Fiber optic) يستخدم الضوء لنقل البيانات ولا يتأثر بالتداخل الكهربائي.",a:true,e:"كابل الألياف الضوئية يستخدم الضوء لنقل البيانات وله مزايا: عرض مجال كبير، سرعة عالية، سلامة من التداخل الكهربائي، وأمان من الاختراق."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"الشبكات الافتراضية الخاصة (VPN) تُقيّد المستخدمين وتمنعهم من الوصول للموارد عن بُعد.",a:false,e:"VPN تتيح للمستخدمين الوصول الآمن للموارد عن بُعد، وتقوم برقابة المحتوى من الفيروسات وإدارة نوعية الخدمة."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"من ضوابط استخدام الإنترنت في المدارس: لا تقم بتنزيل أي برنامج أثناء الاستخدام دون الرجوع للمسؤول التقني.",a:true,e:"من ضوابط الإنترنت المدرسية: لا تنزّل أي برنامج أثناء استخدام الإنترنت، وعند أي رسالة تطلب التحميل توقف عندها أو قيّم بإلغائها."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"Nétiquette هي قواعد أخلاقية عامة تحكم سلوك مستخدمي الإنترنت والشبكات.",a:true,e:"Nétiquette هي أخلاقيات الإنترنت، وهي القواعد العامة التي يتوجب على كل مستخدم احترامها للتعامل السليم مع الشبكة."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"من إيجابيات الإنترنت في التعليم: تغيير دور المعلم من مركز المعلومات الوحيد إلى الموجه والمرشد.",a:true,e:"ربط المدارس بالإنترنت يُغيّر دور المعلم من مصدر المعلومات الوحيد إلى الموجه والمرشد في عملية التعلم."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"انتشار الفيروسات والقرصنة الإلكترونية من إيجابيات استخدام الإنترنت في المدارس.",a:false,e:"انتشار الفيروسات والقرصنة الإلكترونية من سلبيات الإنترنت لا إيجابياتها، وتمثل خطرًا حقيقيًا على الأجهزة والبيانات."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"الجدار الناري (Firewall) يعمل على طرف الشبكة كحارس يتحكم في حركة البيانات الواردة والصادرة.",a:true,e:"الجدار الناري يعمل كمنفذ وحارس على طرف الشبكة يصفي البيانات الواردة ويحافظ على أمن الشبكة من التسلل."},
  {s:"الجزء النظري - شبكات الحاسب",c:4,q:"شبكة الند للند مناسبة للمؤسسات الكبيرة التي لديها مئات الموظفين وتحتاج أعلى مستوى أمان.",a:false,e:"شبكة الند للند مناسبة فقط عندما لا يتجاوز عدد الأجهزة العشرة ولا تكون الحاجة للأمن بالغة. الشبكات الكبيرة تحتاج Client/Server."},
];

let cur=0, sc=0, wr=0, done=false;

function updateHeader(){
  document.getElementById("chip-q").textContent  = "السؤال "+(cur+1)+" من "+qs.length;
  document.getElementById("chip-sc").textContent = "✓ "+sc;
  document.getElementById("chip-wr").textContent = "✗ "+wr;
  document.getElementById("pf").style.width = ((cur/qs.length)*100)+"%";
}

function render(){
  const q=qs[cur]; done=false; updateHeader();
  const badgeClass = BADGE_CLASS[q.c-1];
  const badgeLabel = LABELS[q.c-1]+" — "+q.s;
  const isLast = cur===qs.length-1;
  document.getElementById("area").innerHTML=`
    <div class="q-card">
      <div class="q-meta">
        <span class="section-badge ${badgeClass}">${badgeLabel}</span>
        <span class="q-counter">السؤال ${cur+1} / ${qs.length}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="tf-wrap">
        <button class="tf-btn" id="tft" onclick="pick(true)">✓ صحيح</button>
        <button class="tf-btn" id="tff" onclick="pick(false)">✗ خطأ</button>
      </div>
      <div class="feedback" id="fb"></div>
      <div class="nav-row" id="nav">
        <button class="nav-btn" onclick="next()">${isLast?"عرض النتيجة النهائية":"السؤال التالي ←"}</button>
      </div>
    </div>`;
}

function pick(v){
  if(done)return;
  const q=qs[cur];
  document.getElementById("tft").disabled=true;
  document.getElementById("tff").disabled=true;
  const ok=v===q.a;
  document.getElementById(v?"tft":"tff").classList.add(ok?"state-correct":"state-wrong");
  if(!ok) document.getElementById(q.a?"tft":"tff").classList.add("state-correct");
  const fb=document.getElementById("fb");
  fb.className="feedback state-"+(ok?"correct":"wrong");
  fb.innerHTML="<strong>"+(ok?"✓ إجابة صحيحة! ":"✗ إجابة خاطئة. ")+"</strong>"+q.e;
  fb.style.display="block";
  document.getElementById("nav").style.display="flex";
  if(ok)sc++;else wr++;
  updateHeader(); done=true;
}

function next(){
  cur++;
  if(cur>=qs.length){showResult();return;}
  render(); window.scrollTo({top:0,behavior:"smooth"});
}

function showResult(){
  const pct=Math.round((sc/qs.length)*100);
  document.getElementById("pf").style.width="100%";
  updateHeader();
  let grade,gcolor;
  if(pct>=90){grade="ممتاز 🏆";gcolor="var(--accent)";}
  else if(pct>=80){grade="جيد جدًا ✨";gcolor="#34d399";}
  else if(pct>=65){grade="جيد 👍";gcolor="#fbbf24";}
  else{grade="يحتاج مراجعة 📚";gcolor="#f87171";}

  document.getElementById("area").innerHTML=`
    <div class="result-card">
      <div class="result-circle">
        <div class="result-pct">${pct}%</div>
        <div class="result-pct-label">النتيجة</div>
      </div>
      <div class="result-grade" style="color:${gcolor}">${grade}</div>
      <div class="result-sub">أكملت الاختبار الشامل على الملفات الأربعة</div>
      <div class="result-stats">
        <div class="rs-item rs-correct"><div class="rs-value">${sc}</div><div class="rs-label">إجابات صحيحة</div></div>
        <div class="rs-item rs-wrong"><div class="rs-value">${wr}</div><div class="rs-label">إجابات خاطئة</div></div>
        <div class="rs-item"><div class="rs-value">${qs.length}</div><div class="rs-label">إجمالي الأسئلة</div></div>
      </div>
      <div class="cat-block">
        <img src="${CAT_SRC}" alt="قطة المبرمج">
        <div class="cat-title">فل عليك 🐱</div>
        <div class="cat-sub">وصلِّ على النبي ﷺ</div>
      </div>
      <button class="restart-btn" onclick="restart()">إعادة الاختبار</button>
    </div>`;
}

function restart(){cur=0;sc=0;wr=0;render();window.scrollTo({top:0,behavior:"smooth"});}
render();
</script>
